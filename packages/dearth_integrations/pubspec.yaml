name: dearth_integrations
description: Provider adapters for Dearth (weather, calendars, photos, recipes, music). Pure Dart; runs on the Hub and in Solo mode.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  dearth_core:
  html: ^0.15.7
  http: ^1.6.0
  meta: ^1.19.0
  timezone: ^0.11.1

dev_dependencies:
  drift: ^2.35.1
  lints: ^6.1.0
  sqlite3: ^3.7.0
  test: ^1.31.1
