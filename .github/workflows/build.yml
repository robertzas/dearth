# Dearth CI/CD (SPEC §16.2).
#
# Every push to main: analyze + unit tests, Playwright web E2E against a test
# Hub, release builds for every platform (Android APKs, web, Linux, Windows,
# macOS, iOS unsigned), Hub binaries, the multi-arch Hub image on GHCR, and a
# GitHub release with all of it. Pull requests run the same checks and builds
# without publishing.
name: Build & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2
  DART_VERSION: 3.13.2

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      full: ${{ steps.v.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' apps/dearth_app/pubspec.yaml)
          build=${{ github.run_number }}
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "full=$base-build.$build" >> "$GITHUB_OUTPUT"
          echo "tag=v$base-build.$build" >> "$GITHUB_OUTPUT"

  check:
    name: Analyze & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Quality gate (codegen, analyze, all unit tests)
        run: tool/check.sh
      - name: Generated code is committed and current
        run: git diff --exit-code -- '*.g.dart'

  web:
    name: Web
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: tool/web_assets.sh
      - name: Build
        working-directory: apps/dearth_app
        run: >
          flutter build web --release --no-wasm-dry-run
          --dart-define=DEARTH_VERSION=${{ needs.version.outputs.full }}
          --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/dearth_app/build/web
          retention-days: 7

  e2e:
    name: Web E2E (Playwright)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps/dearth_app/build/web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run the suite (Wall-L, Wall-P, Tablet, Phone)
        run: SKIP_BUILD=1 tool/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  android:
    name: Android APKs
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup
      - name: Release keystore (optional secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DEARTH_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set; APKs are signed with the debug key."
          fi
      - name: Build (armeabi-v7a, arm64-v8a, x86_64)
        working-directory: apps/dearth_app
        env:
          DEARTH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DEARTH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DEARTH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64
          --dart-define=DEARTH_VERSION=${{ needs.version.outputs.full }}
          --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }}
      - name: Name artifacts
        run: |
          mkdir -p out
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "apps/dearth_app/build/app/outputs/flutter-apk/app-$abi-release.apk" "out/dearth-${{ needs.version.outputs.full }}-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  linux:
    name: Linux desktop
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev
      - uses: ./.github/actions/setup
      - name: Build
        working-directory: apps/dearth_app
        run: >
          flutter build linux --release
          --dart-define=DEARTH_VERSION=${{ needs.version.outputs.full }}
          --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }}
      - name: Package
        run: |
          mkdir -p out
          tar -czf "out/dearth-${{ needs.version.outputs.full }}-linux-x64.tar.gz" -C apps/dearth_app/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    name: Windows desktop
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        working-directory: apps/dearth_app
        run: >
          flutter build windows --release
          --dart-define=DEARTH_VERSION=${{ needs.version.outputs.full }}
          --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path apps/dearth_app/build/windows/x64/runner/Release/* -DestinationPath "out/dearth-${{ needs.version.outputs.full }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  macos:
    name: macOS desktop
    needs: version
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        working-directory: apps/dearth_app
        run: >
          flutter build macos --release
          --dart-define=DEARTH_VERSION=${{ needs.version.outputs.full }}
          --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }}
      - name: Package
        run: |
          mkdir -p out
          ditto -c -k --keepParent apps/dearth_app/build/macos/Build/Products/Release/Dearth.app "out/dearth-${{ needs.version.outputs.full }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  ios:
    name: iOS (unsigned)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        working-directory: apps/dearth_app
        run: >
          flutter build ios --release --no-codesign
          --dart-define=DEARTH_VERSION=${{ needs.version.outputs.full }}
          --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build }}
      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R apps/dearth_app/build/ios/iphoneos/Runner.app out/Payload/
          (cd out && zip -qr "dearth-${{ needs.version.outputs.full }}-ios-unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*

  hub:
    name: Hub (${{ matrix.target }})
    needs: [version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: macos-arm64, os: macos-latest }
          - { target: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The Hub is pure Dart: no Flutter SDK (which has no linux-arm64 host
      # build), just Dart and the workspace subset the Hub needs, exactly
      # like the Dockerfile.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Hub-only workspace
        run: |
          printf 'name: dearth_hub_build\npublish_to: none\nenvironment:\n  sdk: ^3.13.0\nworkspace:\n  - packages/dearth_core\n  - packages/dearth_integrations\n  - hub/dearth_hub\n' > pubspec.yaml
          dart pub get
      - name: Compile (dart build cli bundles the SQLite native asset)
        working-directory: hub/dearth_hub
        run: dart build cli -o "$RUNNER_TEMP/hub"
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: ${{ runner.temp }}/hub/bundle/web
      - name: Package (Hub + web app)
        run: |
          mkdir -p out
          name="dearth-hub-${{ needs.version.outputs.full }}-${{ matrix.target }}"
          cp LICENSE compose.yml .env.example "$RUNNER_TEMP/hub/bundle/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "$RUNNER_TEMP/hub/bundle" && 7z a -tzip "$GITHUB_WORKSPACE/out/$name.zip" . >/dev/null)
          else
            tar -czf "out/$name.tar.gz" -C "$RUNNER_TEMP/hub/bundle" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.target }}
          path: out/*

  docker:
    name: Hub image (${{ matrix.arch }})
    needs: [version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/web
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dearth-hub" >> "$GITHUB_OUTPUT"
      # Each architecture builds natively (the Dart toolchain is slow and
      # fragile under QEMU) and is pushed by digest; docker-manifest then
      # publishes both under the release tags.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ needs.version.outputs.full }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=hub-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=hub-${{ matrix.arch }}
      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Hub image (multi-arch tags)
    if: github.event_name == 'push'
    needs: [version, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag latest and this build
        working-directory: ${{ runner.temp }}/digests
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dearth-hub"
          docker buildx imagetools create -t "$name:latest" -t "$name:${{ needs.version.outputs.full }}" $(printf "$name@sha256:%s " *)
          docker buildx imagetools inspect "$name:${{ needs.version.outputs.full }}"

  release:
    name: GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, check, e2e, web, android, linux, windows, macos, ios, hub, docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p release
          (cd artifacts/web && zip -qr "../../release/dearth-${{ needs.version.outputs.full }}-web.zip" .)
          find artifacts -type f \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.ipa' \) -not -path 'artifacts/web/*' -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Release notes
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat > notes.md <<EOF
          Automated build of \`${GITHUB_SHA::7}\`.

          > $(printf '%s' "$COMMIT_MSG" | head -n 1)

          ### Install
          - **Hub (Docker):** \`docker pull ghcr.io/$owner/dearth-hub:${{ needs.version.outputs.full }}\` — see \`compose.yml\`.
          - **Hub (no Docker):** \`dearth-hub-*\` archives contain the Hub and the web app; run \`bin/dearth_hub serve\`.
          - **Android displays and phones:** \`android-armeabi-v7a\` for 32-bit frames (JT215M), \`arm64-v8a\` for most phones and tablets.
          - **Desktop:** Linux \`tar.gz\`, Windows \`zip\`, macOS \`zip\` (unsigned: right-click → Open the first time).
          - **iOS:** unsigned \`.ipa\` for sideloading; iPhones normally use the web app from the Hub.
          - **Try it without a Hub:** every build has *Explore the demo* on first run.

          Checksums are in \`SHA256SUMS.txt\`.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dearth ${{ needs.version.outputs.version }} (build ${{ needs.version.outputs.build }})
          body_path: notes.md
          generate_release_notes: true
          make_latest: 'true'
          files: release/*
