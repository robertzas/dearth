name: Dearth Hub bundle
description: Compiles the Hub (pure Dart, no Flutter SDK) for this runner's platform with the workspace subset in hub/pubspec.workspace.yaml, exactly like the Dockerfile, and uploads the bundle as hub-<target>. The job sets up Dart first (dart-lang/setup-dart can't run inside a composite action; its problem matcher resolves against this folder).
inputs:
  target:
    description: The artifact suffix, e.g. linux-x64.
    required: true
runs:
  using: composite
  steps:
    - name: Hub-only workspace
      shell: bash
      run: |
        cp hub/pubspec.workspace.yaml pubspec.yaml
        dart pub get
    - name: Compile (dart build cli bundles the SQLite native asset)
      shell: bash
      working-directory: hub/dearth_hub
      run: |
        dart build cli -o "$RUNNER_TEMP/hub"
        cp ../../LICENSE ../../compose.yml ../../.env.example "$RUNNER_TEMP/hub/bundle/"
    - uses: actions/upload-artifact@v7
      with:
        name: hub-${{ inputs.target }}
        path: ${{ runner.temp }}/hub/bundle
        include-hidden-files: true
        retention-days: 7
