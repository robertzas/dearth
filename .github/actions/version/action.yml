name: Dearth version
description: This run's release version, a semantic version from the checked-out tree. Major and minor come from the app pubspec's version; the patch is the run number, so every green push to main is a newer release (and the Android versionCode rises with it). Every job computes it itself rather than waiting on a version job.
outputs:
  version:
    description: major.minor.<run number>, e.g. 0.1.97, as shown in the app and the artifact names.
    value: ${{ steps.v.outputs.version }}
  build:
    description: The run number (the Android versionCode's build part, Flutter's --build-number).
    value: ${{ steps.v.outputs.build }}
  full:
    description: The same as version (kept for the workflow's artifact names).
    value: ${{ steps.v.outputs.version }}
  tag:
    description: The release tag, v<version>.
    value: ${{ steps.v.outputs.tag }}
runs:
  using: composite
  steps:
    - id: v
      shell: bash
      run: |
        minor=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' apps/dearth_app/pubspec.yaml)
        [ -n "$minor" ] || { echo "::error::no major.minor in apps/dearth_app/pubspec.yaml"; exit 1; }
        build=${{ github.run_number }}
        echo "version=$minor.$build" >> "$GITHUB_OUTPUT"
        echo "build=$build" >> "$GITHUB_OUTPUT"
        echo "tag=v$minor.$build" >> "$GITHUB_OUTPUT"
