name: Dearth setup
description: Pull Git LFS objects (cached to save LFS bandwidth), install Flutter and resolve the workspace.
inputs:
  flutter-version:
    description: Flutter SDK version (pinned; SPEC §12.2 moves only after the perf gate).
    default: 3.47.6
  pub-get:
    description: Run flutter pub get at the workspace root.
    default: 'true'
  lfs:
    description: Pull the LFS objects (voice clips, sounds, fonts, icons). Analyze and codegen don't read them.
    default: 'true'
  hooks-key:
    description: Extra build-hook cache key part, for matrix legs that build different native assets under one job id (no commas).
    default: ''
runs:
  using: composite
  steps:
    - name: LFS object list
      if: inputs.lfs == 'true'
      shell: bash
      run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
    - name: Restore LFS cache
      if: inputs.lfs == 'true'
      uses: actions/cache@v6
      with:
        path: .git/lfs
        key: lfs-v1-${{ hashFiles('.lfs-assets-id') }}
        restore-keys: lfs-v1-
    - name: Pull LFS objects
      if: inputs.lfs == 'true'
      shell: bash
      run: git lfs pull && rm -f .lfs-assets-id
    # cache: true keeps the SDK and the pub cache (keyed on pubspec.lock), so
    # no second pub-cache step: restoring the same files twice cost 10-35 s.
    - name: Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true
    # Native build hooks compile C/C++ (flutter_soloud, sqlite3) per target:
    # minutes per job (Android builds three ABIs), so keep their outputs.
    - name: Build-hook cache
      uses: actions/cache@v6
      with:
        path: .dart_tool/hooks_runner
        key: hooks-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}${{ inputs.hooks-key }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
        restore-keys: hooks-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}${{ inputs.hooks-key }}-
    - name: Resolve workspace
      if: inputs.pub-get == 'true'
      shell: bash
      run: flutter pub get
