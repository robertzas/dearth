name: dearth_workspace
description: Dearth monorepo (pub workspace). See README.md.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/dearth_core
  - packages/dearth_integrations
  - packages/dearth_ui
  - hub/dearth_hub
  - apps/dearth_app

dev_dependencies:
  lints: ^6.1.0

# flutter_soloud only plays synthesized WAV (lib/core/synth.dart): skip its
# Ogg/Opus/Vorbis/FLAC libraries (smaller binaries, no prebuilt download).
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true
