<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Dearth app mark: a "D" with a rising sun, on the brand indigo.
       Full-bleed square; platforms mask it (iOS, Android adaptive) or the
       build script rounds it (web favicon, macOS, Windows). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B78F6"/>
      <stop offset="1" stop-color="#4646BE"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFE2A0"/>
      <stop offset="1" stop-color="#F4A23A"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <path d="M0 792 C 250 716 560 736 1024 664 L1024 1024 L0 1024 Z" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="742" cy="300" r="92" fill="url(#sun)"/>
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M300 262 H498 A250 250 0 0 1 498 762 H300 Z M402 362 H492 A150 150 0 0 1 492 662 H402 Z"/>
</svg>
